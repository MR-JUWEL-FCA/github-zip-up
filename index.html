<style>

*{box-sizing:inherit}html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:14px}

<h2>১) নতুন লোগো ও লগ ইন বাটন</h2>

<h2>২) আপলোড শেষে Reload</h2>

<h2>৩) আপনার ফাইলে বদলগুলো বসান</h2>
<div class="card">
<div style="text-align:left;font-size:14px">আপনার <b>index.html</b> বেছে নিন। চারটা বদলই নিজে বসে যাবে, তারপর ZIP বা HTML ডাউনলোড করবেন।</div>
<input type="file" id="pf" accept=".html,text/html">
<div class="row"><button class="pri" id="dz" disabled>ZIP ডাউনলোড</button><button id="dh" disabled>HTML ডাউনলোড</button></div>
<div id="out"></div>
</div>
</div>

<script type="text/plain" id="ct">async function commitTree(entries, message) {
  for (let k = 0; ; k++) {
    try {
      const ref = await gh(`/repos/${repo}/git/ref/heads/${encodeURIComponent(branch)}`);
      const base = await gh(`/repos/${repo}/git/commits/${ref.object.sha}`);
      const tree = await gh(`/repos/${repo}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: base.tree.sha, tree: entries }) });
      const commit = await gh(`/repos/${repo}/git/commits`, { method: 'POST', body: JSON.stringify({ message, tree: tree.sha, parents: [ref.object.sha] }) });
      await gh(`/repos/${repo}/git/refs/heads/${encodeURIComponent(branch)}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
      tc = null; return;
    } catch (e) {
      if (k < 4 && /fast.forward|Reference update failed|conflict/i.test(e.message)) { await sleep(600 * (k + 1)); continue; }
      throw e;
    }
  }
}</script>
<script type="text/plain" id="rm">let delChain = Promise.resolve(), delN = 0;
async function removeMany(paths) {
  if (!confirm(`Delete ${paths.length} item(s)? Folders go with everything inside.`)) return;
  const snap = cur, gone = new Set(paths);
  cur = cur.filter(i => !gone.has(i.path)); endSel(); drawFiles(); say(`Deleting ${paths.length} item(s)…`);
  delN++;
  delChain = delChain.then(async () => {
    try {
      const ents = [], dirs = [];
      paths.forEach(p => { const it = snap.find(i => i.path === p); if (it && it.type === 'dir') dirs.push(it); else ents.push({ path: p, mode: '100644', type: 'blob', sha: null }); });
      await Promise.all(dirs.map(async d => {
        const t = await retry(() => gh(`/repos/${repo}/git/trees/${d.sha}?recursive=1`));
        t.tree.forEach(x => { if (x.type === 'blob') ents.push({ path: d.path + '/' + x.path, mode: '100644', type: 'blob', sha: null }); });
      }));
      if (ents.length) { await retry(() => commitTree(ents, `Delete ${paths.length} item(s)`)); say('Deleted ✅'); }
    } catch (e) { say(e.message, true); }
  }).then(() => { if (--delN === 0) loadDir(); });
}</script>
<script type="text/plain" id="lg">const LOGO = '<svg class="gl" viewBox="0 0 100 100"><circle class="ring" cx="50" cy="50" r="47" fill="none" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round" style="stroke:var(--ac2)"/><circle cx="50" cy="50" r="40" stroke-width="2.5" style="fill:#130a1d;stroke:var(--ac)"/><path transform="translate(22 22) scale(3.5)" style="fill:var(--ac)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';</script>

<script>
const T = id => document.getElementById(id).textContent;
/* demo: upload progress, then the Reload button */
let tm;
function demo(){
  clearInterval(tm);
  const g=document.getElementById('g'),c=document.getElementById('c'),bar=document.getElementById('bar'),pt=document.getElementById('pt'),fl=document.getElementById('fl');
  g.textContent='🚀 Push';c.textContent='Cancel';g.disabled=false;bar.style.width='0';fl.innerHTML='';pt.textContent='Pushing…';
  c.textContent='Stop';g.disabled=true;let n=0;const names=['index.html','style.css','app.js','logo.png','README.md'];
  tm=setInterval(()=>{
    n++;bar.style.width=n*20+'%';pt.textContent=n+' / 5 files ('+n*20+'%)';
    fl.insertAdjacentHTML('beforeend','<div><span class="ok">✓</span> '+names[n-1]+'</div>');
    if(n===5){clearInterval(tm);pt.textContent='✅ Done! Press Reload';g.disabled=false;g.textContent='🔄 Reload';c.textContent='Close';g.onclick=()=>demo();}
  },700);
}
document.getElementById('c').onclick=demo;demo();

/* patcher */
let html='',cnt=0;
function swap(src,start,end,rep,label,log){
  const a=src.indexOf(start);if(a<0){log.push('✕ '+label+' পাওয়া যায়নি');return src;}
  const b=src.indexOf(end,a);if(b<0){log.push('✕ '+label+' শেষ পাওয়া যায়নি');return src;}
  log.push('✓ '+label);return src.slice(0,a)+rep+src.slice(b+end.length);
}
function put(src,from,to,label,log){
  if(!src.includes(from)){log.push('✕ '+label+' পাওয়া যায়নি');return src;}
  log.push('✓ '+label);return src.replace(from,()=>to);
}
document.getElementById('pf').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;let s=await f.text();const L=[];
  s=swap(s,'async function commitTree(entries, message) {','\n}',T('ct'),'commitTree',L);
  s=swap(s,'async function removeMany(paths) {','\n}',T('rm'),'ডিলেট (removeMany)',L);
  s=swap(s,"const LOGO = '","</svg>';",T('lg'),'লোগো',L);
  s=put(s,"🚀 Let's go</button>",'🚀 Log in now</button>','লগ ইন বাটন',L);
  s=put(s,`"🚀 Let's go": '🚀 শুরু করুন'`,`'🚀 Log in now': '🚀 লগ ইন নাও', '🔄 Reload': '🔄 রিলোড'`,'বাংলা অনুবাদ',L);
  s=put(s,'let hlOn = false, mdOn = false;','let upDone = false;\nlet hlOn = false, mdOn = false;','upDone ভ্যারিয়েবল',L);
  const re=/await sleep\(700\);\s*busy = false;[^\n]*loadDir\(\);/;
  if(re.test(s)){s=s.replace(re,()=>"busy = false; pend = null; upDone = true;\n  if (!hold) prog(100, '✅ Done! Press Reload');\n  $('upGo').disabled = false; $('upGo').textContent = '🔄 Reload'; $('upCancel').textContent = 'Close';");L.push('✓ আপলোড শেষ অংশ');}else L.push('✕ আপলোড শেষ অংশ পাওয়া যায়নি');
  s=put(s,'function openUp(mode) {',"function openUp(mode) {\n  upDone = false; $('upGo').textContent = '🚀 Push'; $('upCancel').textContent = 'Cancel';",'openUp',L);
  s=put(s,"$('upGo').onclick = () => {","$('upGo').onclick = () => {\n  if (upDone) { upDone = false; show('prog', false); show('mUp', false); tc = null; loadDir(); loadRepos().catch(() => {}); return; }",'Reload বাটনের কাজ',L);
  html=s;document.getElementById('out').textContent=L.join('\n');
  const bad=L.some(x=>x[0]==='✕');document.getElementById('dz').disabled=bad;document.getElementById('dh').disabled=bad;
};
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
document.getElementById('dh').onclick=()=>save(new Blob([html],{type:'text/html'}),'index.html');
document.getElementById('dz').onclick=async()=>{const z=new JSZip();z.file('index.html',html);save(await z.generateAsync({type:'blob'}),'github-zip-up.zip');};
</script></body></html>
